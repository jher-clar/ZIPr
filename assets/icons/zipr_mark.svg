<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="forestPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#344922"/>
      <stop offset="100%" stop-color="#233418"/>
    </linearGradient>
    <filter id="quadShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#forestPlate)" stroke="#4A6332" stroke-width="2.5"/>
  <!-- Quadrant Grid -->
  <!-- Z (Top-Left: Ivory Cream) -->
  <rect x="18" y="18" width="29" height="29" rx="8" fill="#FFF5EB" filter="url(#quadShadow)"/>
  <path d="M24 25 H41 L27 40 H41" stroke="#2A3B19" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- I (Top-Right: Sunburst Yellow) -->
  <rect x="53" y="18" width="29" height="29" rx="8" fill="#FFDE59" filter="url(#quadShadow)"/>
  <path d="M62 25 H74 M67.5 25 V40 M62 40 H74" stroke="#2A3B19" stroke-width="2.5" stroke-linecap="round"/>
  <!-- P (Bottom-Left: Sunset Orange) -->
  <rect x="18" y="53" width="29" height="29" rx="8" fill="#FF914D" filter="url(#quadShadow)"/>
  <path d="M26 60 H34 C37 60 39 62 39 65 C39 68 37 70 34 70 H26 V75" stroke="#2A3B19" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- R (Bottom-Right: Leaf Green) -->
  <rect x="53" y="53" width="29" height="29" rx="8" fill="#7ED957" filter="url(#quadShadow)"/>
  <path d="M60 60 H68 C71 60 73 62 73 65 C73 68 71 70 68 70 H60 V75 M68 70 L74 75" stroke="#2A3B19" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
